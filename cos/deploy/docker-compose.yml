services:
  memory:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: cos-memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:8747:8747"   # keep local; expose via Caddy/Tailscale, never raw
    volumes:
      - ../data:/opt/cos/data
    environment:
      - COS_DB_PATH=/opt/cos/data/cos.db

  # One-shot agent runs, e.g.:
  #   docker compose run --rm agent --agent orchestrator
  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["python", "-m", "runner.run_agent"]
    volumes:
      - ../data:/opt/cos/data
    environment:
      - COS_DB_PATH=/opt/cos/data/cos.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    profiles: ["manual"]
